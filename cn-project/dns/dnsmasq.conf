# ---- Team DNS (Mac 1, 10.7.7.5) ----
# Path on the Mac: /opt/homebrew/etc/dnsmasq.conf
no-resolv
server=8.8.8.8
server=1.1.1.1

# Our zone: answer it ourselves, never forward it upstream
local=/solo.test/

# Both names point to the edge (Mac 2)
host-record=app.solo.test,10.7.21.121
host-record=api.solo.test,10.7.21.121

# TTL for our records (seconds)
local-ttl=60

# Log every query
log-queries

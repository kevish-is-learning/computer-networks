# ---- Edge (Mac 2, 10.7.21.121) ----
# Path on the Mac: /opt/homebrew/etc/nginx/servers/solo.conf
upstream team_backends {                                        # default strategy = round-robin
    server 10.7.26.163:3001 max_fails=1 fail_timeout=10s;       # Backend A
    server 10.7.26.163:3002 max_fails=1 fail_timeout=10s;       # Backend B
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.solo.test api.solo.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.solo.test api.solo.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/solo.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/solo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://team_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend is down, fail fast and retry on the other one
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
